name: Item detail probe

on:
  push:
    paths:
      - ".github/workflows/item-detail-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose Wikiru source response
        shell: python
        run: |
          import html, re, urllib.parse, urllib.request
          page="テーブル/天然資源"
          url="https://arknights-endfield.wikiru.jp/?" + urllib.parse.urlencode({"cmd":"source","page":page})
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req,timeout=30) as r:
              body=r.read().decode("utf-8","replace")
              print("FINAL",r.geturl(),"BODYLEN",len(body))
          print("HAS_PRE",bool(re.search(r"<pre[^>]*>",body,re.I)))
          m=re.search(r"<pre[^>]*>(.*?)</pre>",body,re.I|re.S)
          if m:
              src=html.unescape(re.sub(r"<[^>]+>","",m.group(1)))
          else:
              plain=html.unescape(re.sub(r"<[^>]+>","\n",body))
              plain=re.sub(r"\n+","\n",plain)
              marker="最終更新日時:&lastmod;"
              p=plain.find(marker)
              src=plain[p:] if p>=0 else plain
          print("SRCLEN",len(src))
          print("START",repr(src[:1200]))
          rows=[line for line in src.splitlines() if line.startswith("|")]
          print("ROWCOUNT",len(rows))
          print("ROW0",repr(rows[:3]))
