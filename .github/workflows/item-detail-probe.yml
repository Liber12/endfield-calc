name: Generate item details

on:
  push:
    paths:
      - ".github/workflows/item-detail-probe.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate compact item detail data from Wikiru
        shell: python
        run: |
          import html, json, re, urllib.parse, urllib.request
          from pathlib import Path

          pages = [
              "テーブル/天然資源",
              "テーブル/採集素材",
              "テーブル/工業製品",
              "テーブル/中身入り各種ボトル",
              "テーブル/消費アイテム",
              "テーブル/携帯アイテム",
          ]

          with open("public/locales/ja/item.json", encoding="utf-8") as f:
              ja = json.load(f)

          name_to_ids = {}
          for item_id, name in ja.items():
              name_to_ids.setdefault(name, []).append(item_id)

          def fetch(page):
              url = "https://arknights-endfield.wikiru.jp/?" + urllib.parse.urlencode(
                  {"cmd":"source","page":page}
              )
              req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  body = r.read().decode("utf-8","replace")
              m = re.search(r"<pre[^>]*>(.*?)</pre>", body, re.I|re.S)
              if not m:
                  return ""
              return html.unescape(re.sub(r"<[^>]+>", "", m.group(1)))

          def clean_text(s):
              s = html.unescape(s)
              s = re.sub(r"&color\([^)]*\)\{([^}]*)\};?", r"\1", s)
              s = re.sub(r"&size\([^)]*\)\{([^}]*)\};?", r"\1", s)
              s = re.sub(r"&tooltip\(([^)]+)\)\{[^}]*\};?", r"\1", s)
              s = re.sub(r"&ruby\([^)]*\)\{([^}]*)\};?", r"\1", s)
              s = re.sub(r"''([^']+)''", r"\1", s)
              s = s.replace("&br;", "\n").replace("~", "")
              s = re.sub(r"\s*\n\s*", "\n", s)
              return s.strip()

          details = {}

          for page in pages:
              src = fetch(page)
              kind = "effect" if "|~効果|" in src else "description"

              for line in src.splitlines():
                  if not line.startswith("|&ref") and not line.startswith("||"):
                      continue
                  cells = line.strip("|").split("|")
                  if len(cells) < 5:
                      continue

                  name_match = re.search(r"\[\[([^]>]+)(?:>[^]]+)?\]\]", cells[2])
                  if not name_match:
                      continue
                  name = name_match.group(1).strip()
                  primary = clean_text(cells[3])
                  if not primary:
                      continue

                  for item_id in name_to_ids.get(name, []):
                      if (
                          page != "テーブル/中身入り各種ボトル"
                          and (item_id.startswith("item_fbottle_") or item_id.startswith("item_gasjar_"))
                      ):
                          continue
                      details[item_id] = {
                          "kind": kind,
                          "text": primary,
                          "sourcePage": page,
                      }

          serialized = json.dumps(details, ensure_ascii=False, indent=2)
          out = (
              'import type { ItemId } from "@/types";\n\n'
              'export type MaterialItemDetail = {\n'
              '  kind: "description" | "effect";\n'
              '  text: string;\n'
              '  sourcePage: string;\n'
              '};\n\n'
              '/** Compact functional item text extracted from Wikiru item tables.\n'
              ' * Flavor/lore columns are intentionally not copied.\n'
              ' * Last generated: 2026-09-27.\n'
              ' */\n'
              'export const materialItemDetails: Readonly<Record<string, MaterialItemDetail>> = '
              + serialized
              + ';\n\n'
              'export function getMaterialItemDetail(itemId: ItemId): MaterialItemDetail | undefined {\n'
              '  return materialItemDetails[itemId];\n'
              '}\n'
          )

          Path("src/data/material-item-details.ts").write_text(out, encoding="utf-8")
          print("generated", len(details), "entries")

      - name: Commit generated item details
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/material-item-details.ts
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Data: add item descriptions and effects"
          git push
