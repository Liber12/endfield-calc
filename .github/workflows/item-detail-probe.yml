name: Item detail probe

on:
  push:
    paths:
      - ".github/workflows/item-detail-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe Wikiru item list
        shell: python
        run: |
          import html, re, urllib.parse, urllib.request

          page = "アイテム一覧"
          url = "https://arknights-endfield.wikiru.jp/?" + urllib.parse.urlencode(
              {"cmd":"source","page":page}
          )
          req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=30) as r:
              body = r.read().decode("utf-8","replace")

          m = re.search(r"<pre[^>]*>(.*?)</pre>", body, re.I|re.S)
          if m:
              src = html.unescape(re.sub(r"<[^>]+>", "", m.group(1)))
          else:
              plain = html.unescape(re.sub(r"<[^>]+>", "\n", body))
              plain = re.sub(r"\n+", "\n", plain)
              marker = "最終更新日時:&lastmod;"
              pos = plain.find(marker)
              src = plain[pos:] if pos >= 0 else plain

          print("LEN", len(src))
          print("=== HEAD ===")
          print(src[:50000])
          for pat in ["源石粉末","結晶外殻","芽針注射液Ⅰ","携帯式バッテリー","鉄鉱石","紫晶製ボトル"]:
              print("\n=== MATCH", pat, "===")
              p = src.find(pat)
              print(src[max(0,p-2500):p+5000] if p>=0 else "NOT FOUND")
