name: Item detail probe

on:
  push:
    paths:
      - ".github/workflows/item-detail-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Wikiru item tables
        shell: python
        run: |
          import html, re, urllib.parse, urllib.request

          pages = [
              "テーブル/天然資源",
              "テーブル/採集素材",
              "テーブル/工業製品",
              "テーブル/中身入り各種ボトル",
              "テーブル/消費アイテム",
              "テーブル/携帯アイテム",
          ]

          def fetch(page):
              url = "https://arknights-endfield.wikiru.jp/?" + urllib.parse.urlencode(
                  {"cmd":"source","page":page}
              )
              req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  body = r.read().decode("utf-8","replace")
              m = re.search(r"<pre[^>]*>(.*?)</pre>", body, re.I|re.S)
              if m:
                  return html.unescape(re.sub(r"<[^>]+>", "", m.group(1)))
              plain = html.unescape(re.sub(r"<[^>]+>", "\n", body))
              plain = re.sub(r"\n+", "\n", plain)
              marker = "最終更新日時:&lastmod;"
              p = plain.find(marker)
              return plain[p:] if p >= 0 else plain

          for page in pages:
              src = fetch(page)
              print("\n=== PAGE", page, "LEN", len(src), "===")
              print(src[:30000])
