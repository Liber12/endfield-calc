# Deploy the current fork master to GitHub Pages.
# Both the root URL and /beta/ are built from current master so existing
# shared links keep working without depending on stale upstream release tags.
name: Deploy static content to Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v5
        with:
          ref: master

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build root site from master
        run: pnpm build

      - name: Build beta-compatible path from master
        run: pnpm build:beta

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke-test live deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -e
          for i in 1 2 3 4 5 6 7; do
            root_ok=$(curl -fsS "${PAGE_URL%/}/?cb=$RANDOM" | grep -c '/endfield-calc/assets/index-' || true)
            beta_ok=$(curl -fsS "${PAGE_URL%/}/beta/?cb=$RANDOM" | grep -c '/endfield-calc/beta/assets/index-' || true)
            echo "Attempt $i: root=$root_ok beta=$beta_ok"
            if [ "$root_ok" -gt 0 ] && [ "$beta_ok" -gt 0 ]; then
              echo "Smoke test passed."
              exit 0
            fi
            case "$i" in
              1) sleep 10 ;;
              2) sleep 20 ;;
              3) sleep 30 ;;
              4) sleep 45 ;;
              5) sleep 60 ;;
              6) sleep 90 ;;
            esac
          done
          echo "::error::live deployment did not expose root and beta entry assets."
          exit 1
