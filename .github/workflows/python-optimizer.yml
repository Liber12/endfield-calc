name: Python Optimizer

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  optimizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install optimizer dependencies
        run: python -m pip install -r endfield-optimizer/requirements.txt
      - name: Compile Python optimizer sources
        run: python -m compileall -q endfield-optimizer/src endfield-optimizer/tests
      - name: Check integrated data source
        run: python endfield-optimizer/tests/source_test.py
      - name: Check validated optimizer snapshot
        run: python endfield-optimizer/tests/smoke_test.py
      - name: Check current game-rule constraints
        run: python endfield-optimizer/tests/current_model_test.py

      - name: Verify 1.5 outpost budget and transfer economics
        run: python endfield-optimizer/tests/economic_model_test.py
      - name: Solve current Wuling and Valley scenarios
        run: python endfield-optimizer/tests/current_integration_test.py
      - name: Execute current CLI dashboard
        run: python endfield-optimizer/src/solver.py 武陵 profit > /tmp/current-optimizer.txt && grep '基地運用ダッシュボード' /tmp/current-optimizer.txt
