# .github/workflows/test.yml

name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions for the workflow
permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20.x"
          cache: "pnpm"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm test

      - name: Build web app
        run: pnpm build

      - name: Smoke-test CLI
        run: |
          bun run scripts/calc.ts --help > /tmp/cli-help.txt
          bun run scripts/calc.ts plan --config examples/cli-plan.json > /tmp/cli-plan.json
          node -e 'const x=require("/tmp/cli-plan.json"); if(x.schemaVersion!==1 || x.command!=="plan" || !x.plan) process.exit(1)'
