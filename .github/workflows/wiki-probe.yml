name: Wiki probe

on:
  push:
    paths:
      - ".github/workflows/wiki-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse compact Wikiru usage data
        shell: python
        run: |
          import html
          import json
          import re
          import urllib.parse
          import urllib.request

          with open("public/locales/ja/item.json", encoding="utf-8") as f:
              item_names_by_id = json.load(f)

          alias_to_id = {name: item_id for item_id, name in item_names_by_id.items()}
          alias_to_id["芽針注射針Ⅰ"] = "item_bottled_rec_hp_4"
          alias_to_id["芽針注射針Ⅱ"] = "item_bottled_rec_hp_5"

          # Filled-container entries intentionally share visible labels with empty containers.
          # External-use tables never refer to filled transport containers, so prefer the actual
          # targetable empty-container IDs for duplicate names.
          preferred = {
              "紫晶製ボトル": "item_glass_bottle",
              "高晶製ボトル": "item_glass_enr_bottle",
              "青鉄製ボトル": "item_iron_bottle",
              "鋼製ボトル": "item_iron_enr_bottle",
              "赤銅ボトル": "item_copper_bottle",
              "緋銅ボトル": "item_copper_enr_bottle",
              "赤銅圧力タンク": "item_copper_jar",
          }
          alias_to_id.update(preferred)

          names = sorted(alias_to_id, key=len, reverse=True)

          def fetch_source(page):
              url = "https://arknights-endfield.wikiru.jp/?" + urllib.parse.urlencode(
                  {"cmd":"source","page":page}
              )
              req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  body = r.read().decode("utf-8", "replace")
              m = re.search(r"<pre[^>]*>(.*?)</pre>", body, re.I|re.S)
              if m:
                  return html.unescape(re.sub(r"<[^>]+>", "", m.group(1)))
              plain = html.unescape(re.sub(r"<[^>]+>", "\n", body))
              plain = re.sub(r"\n+", "\n", plain)
              marker = "最終更新日時:&lastmod;"
              pos = plain.find(marker)
              return plain[pos:] if pos >= 0 else plain

          def plain_cell(s):
              s = re.sub(r"&ref\([^;]+\);?", "", s)
              s = re.sub(r"&tooltip\(([^)]+)\)\{[^}]*\};?", r"\1", s)
              s = re.sub(r"&ruby\([^)]*\)\{\s*([^}]*)\};?", r"\1", s)
              s = re.sub(r"&color\([^)]*\)\{([^}]*)\};?", r"\1", s)
              s = re.sub(r"\[\[([^]>]+)(?:>[^]]+)?\]\]", r"\1", s)
              s = re.sub(r"\(\([^)]*\)\)", "", s)
              return s.replace("&br;", " / ").replace("~", "").strip()

          def recognized_name(text):
              p = plain_cell(text)
              for name in names:
                  if name in p:
                      return name
              return None

          production = fetch_source("工業製品加工レシピ")
          s = production.find("*工業設備 [#Production]")
          e = production.find("*コメントフォーム", s)
          sec = production[s:e if e >= 0 else None]

          facility_costs = []
          current_facility = None
          pending_qty = None
          for line in sec.splitlines():
              m = re.match(r"\*\*\*\[\[([^]]+)\]\]", line)
              if m:
                  current_facility = plain_cell(m.group(1))
                  pending_qty = None
                  continue
              if not current_facility or not line.startswith("|") or line.startswith("//"):
                  continue
              qty_m = re.search(r"\bx\s*(\d+)\b", line)
              name = recognized_name(line)
              if qty_m:
                  qty = int(qty_m.group(1))
                  if name:
                      facility_costs.append({
                          "facility": current_facility,
                          "itemId": alias_to_id[name],
                          "item": name,
                          "amount": qty,
                      })
                      pending_qty = None
                  else:
                      pending_qty = qty
              elif pending_qty is not None and name:
                  facility_costs.append({
                      "facility": current_facility,
                      "itemId": alias_to_id[name],
                      "item": name,
                      "amount": pending_qty,
                  })
                  pending_qty = None

          # Deduplicate image/text double rows.
          seen = set()
          facility_costs = [
              x for x in facility_costs
              if not ((x["facility"], x["itemId"], x["amount"]) in seen
                      or seen.add((x["facility"], x["itemId"], x["amount"])))
          ]

          region = fetch_source("地域建設システム")
          current_heading = ""
          current_subheading = ""
          in_trade_table = False
          trade_goods = []
          other_rows = []

          for line in region.splitlines():
              if line.startswith("***"):
                  current_subheading = plain_cell(re.sub(r"^\*+", "", line).split("[#")[0])
                  in_trade_table = False
                  continue
              if line.startswith("**") and not line.startswith("***"):
                  current_heading = plain_cell(re.sub(r"^\*+", "", line).split("[#")[0])
                  current_subheading = ""
                  in_trade_table = False
                  continue

              if line.startswith("|") and "取引商品" in line:
                  in_trade_table = True
                  continue
              if line.startswith("*") or line.startswith("#region") or line.startswith("#endregion"):
                  if not line.startswith("|"):
                      in_trade_table = False

              if not line.startswith("|"):
                  continue

              cells = [plain_cell(x) for x in line.strip("|").split("|")]
              row_items = []
              for i, cell in enumerate(cells):
                  for name in names:
                      if name == cell or name in cell:
                          row_items.append((i, name, alias_to_id[name]))
                          break

              if not row_items:
                  continue

              if in_trade_table:
                  for i, name, item_id in row_items:
                      price = None
                      if i + 1 < len(cells) and re.fullmatch(r"[0-9,]+", cells[i+1] or ""):
                          price = int(cells[i+1].replace(",", ""))
                      stage = cells[0] if cells else ""
                      trade_goods.append({
                          "base": current_subheading or current_heading,
                          "section": current_heading,
                          "stage": stage,
                          "itemId": item_id,
                          "item": name,
                          "price": price,
                      })
              else:
                  # Surface other region-construction material tables (e.g. expansion/delivery)
                  other_rows.append({
                      "section": current_heading,
                      "subsection": current_subheading,
                      "cells": cells,
                      "items": [
                          {"itemId": item_id, "item": name}
                          for _, name, item_id in row_items
                      ],
                  })

          # Deduplicate identical trade entries while preserving order.
          seen_trade = set()
          trade_goods = [
              x for x in trade_goods
              if not ((x["base"], x["stage"], x["itemId"], x["price"]) in seen_trade
                      or seen_trade.add((x["base"], x["stage"], x["itemId"], x["price"])))
          ]

          print("FACILITY_COSTS=" + json.dumps(facility_costs, ensure_ascii=False, separators=(",",":")))
          print("TRADE_GOODS=" + json.dumps(trade_goods, ensure_ascii=False, separators=(",",":")))
          print("OTHER_REGION_ROWS=" + json.dumps(other_rows, ensure_ascii=False, separators=(",",":")))
