name: Wiki probe

on:
  push:
    paths:
      - ".github/workflows/wiki-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Extract relevant Wikiru source sections
        shell: python
        run: |
          import html
          import re
          import urllib.parse
          import urllib.request

          def fetch_source(page):
              url = "https://arknights-endfield.wikiru.jp/?" + urllib.parse.urlencode(
                  {"cmd":"source","page":page}
              )
              req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  body = r.read().decode("utf-8", "replace")
              m = re.search(r"<pre[^>]*>(.*?)</pre>", body, re.I|re.S)
              if m:
                  return html.unescape(re.sub(r"<[^>]+>", "", m.group(1)))
              # Wikiru currently renders source as escaped text outside a textarea/pre
              plain = html.unescape(re.sub(r"<[^>]+>", "\n", body))
              plain = re.sub(r"\n+", "\n", plain)
              marker = "最終更新日時:&lastmod;"
              pos = plain.find(marker)
              return plain[pos:] if pos >= 0 else plain

          def section(src, start_markers, end_markers=()):
              starts = [src.find(m) for m in start_markers if src.find(m) >= 0]
              if not starts:
                  return ""
              s = min(starts)
              ends = [src.find(m, s + 1) for m in end_markers if src.find(m, s + 1) >= 0]
              e = min(ends) if ends else len(src)
              return src[s:e]

          production = fetch_source("工業製品加工レシピ")
          region = fetch_source("地域建設システム")
          market = fetch_source("地域建設システム/時価商品一覧")

          print("=== PRODUCTION ===")
          print(section(
              production,
              ["*工業設備 [#Production]", "*工業設備"],
              ["*コメントフォーム", "#pcomment"]
          )[:50000])

          print("=== REGION KEY SECTIONS ===")
          for key in ["拠点取引", "納品", "商品", "取引", "発展値", "地域建設"]:
              pos = region.find(key)
              if pos >= 0:
                  print(f"--- MATCH {key} ---")
                  print(region[max(0,pos-2000):pos+12000])

          print("=== MARKET TABLE ===")
          print(market[:40000])
