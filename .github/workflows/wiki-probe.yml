name: Wiki probe

on:
  push:
    paths:
      - ".github/workflows/wiki-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Wikiru source endpoints
        shell: python
        run: |
          import html
          import re
          import urllib.parse
          import urllib.request

          pages = [
              "地域建設システム",
              "工業製品加工レシピ",
              "地域建設システム/時価商品一覧",
          ]
          patterns = [
              "設備製造", "Production", "拠点取引", "納品",
              "結晶外殻", "基本部品", "取引", "製造",
          ]

          for page in pages:
              q = urllib.parse.quote(page)
              urls = [
                  f"https://arknights-endfield.wikiru.jp/?{q}",
                  f"https://arknights-endfield.wikiru.jp/index.php?{q}",
                  "https://arknights-endfield.wikiru.jp/?" + urllib.parse.urlencode({"cmd":"read","page":page}),
                  "https://arknights-endfield.wikiru.jp/?" + urllib.parse.urlencode({"cmd":"edit","page":page}),
                  "https://arknights-endfield.wikiru.jp/?" + urllib.parse.urlencode({"cmd":"source","page":page}),
              ]
              print("\n### PAGE", page)
              for url in urls:
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
                      with urllib.request.urlopen(req, timeout=20) as r:
                          body = r.read().decode("utf-8", "replace")
                          final = r.geturl()
                      print("\nURL", url)
                      print("FINAL", final, "LEN", len(body))
                      title = re.search(r"<title[^>]*>(.*?)</title>", body, re.I|re.S)
                      print("TITLE", html.unescape(re.sub(r"<.*?>","", title.group(1))).strip() if title else "")
                      ta = re.search(r"<textarea[^>]*>(.*?)</textarea>", body, re.I|re.S)
                      if ta:
                          src = html.unescape(ta.group(1))
                          print("TEXTAREA_LEN", len(src))
                          for pat in patterns:
                              pos = src.find(pat)
                              if pos >= 0:
                                  print("SRC_MATCH", pat, src[max(0,pos-500):pos+2500].replace("\r",""))
                      plain = html.unescape(re.sub(r"<[^>]+>", "\n", body))
                      plain = re.sub(r"\n+", "\n", plain)
                      for pat in patterns:
                          pos = plain.find(pat)
                          if pos >= 0:
                              print("HTML_MATCH", pat, plain[max(0,pos-500):pos+2500])
                  except Exception as e:
                      print("ERROR", type(e).__name__, str(e))
