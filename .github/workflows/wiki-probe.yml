name: Wiki probe

on:
  push:
    paths:
      - ".github/workflows/wiki-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Parse Wikiru usage data
        shell: python
        run: |
          import html
          import json
          import re
          import urllib.parse
          import urllib.request

          def fetch_source(page):
              url = "https://arknights-endfield.wikiru.jp/?" + urllib.parse.urlencode(
                  {"cmd":"source","page":page}
              )
              req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  body = r.read().decode("utf-8", "replace")
              m = re.search(r"<pre[^>]*>(.*?)</pre>", body, re.I|re.S)
              if m:
                  return html.unescape(re.sub(r"<[^>]+>", "", m.group(1)))
              plain = html.unescape(re.sub(r"<[^>]+>", "\n", body))
              plain = re.sub(r"\n+", "\n", plain)
              marker = "最終更新日時:&lastmod;"
              pos = plain.find(marker)
              return plain[pos:] if pos >= 0 else plain

          def clean(cell):
              cell = re.sub(r"&ref\([^;]+;?", "", cell)
              cell = re.sub(r"&tooltip\(([^)]+)\)\{[^}]*\};?", r"\1", cell)
              cell = re.sub(r"&ruby\([^)]*\)\{\s*([^}]*)\};?", r"\1", cell)
              cell = re.sub(r"&color\([^)]*\)\{([^}]*)\};?", r"\1", cell)
              cell = re.sub(r"\[\[([^]>]+)(?:>[^]]+)?\]\]", r"\1", cell)
              cell = re.sub(r"\(\([^)]*\)\)", "", cell)
              cell = cell.replace("&br;", " / ")
              cell = cell.replace("~", "").strip()
              return cell

          prod = fetch_source("工業製品加工レシピ")
          s = prod.find("*工業設備 [#Production]")
          if s < 0:
              s = prod.find("*工業設備")
          e = prod.find("*コメントフォーム", s)
          prod_sec = prod[s:e if e >= 0 else None]

          print("=== RAW PRODUCTION HEAD ===")
          print(prod_sec[:16000])

          facilities = []
          current = None
          for line in prod_sec.splitlines():
              m = re.match(r"\*\*\*\[\[([^]]+)\]\]", line)
              if m:
                  if current:
                      facilities.append(current)
                  current = {"name": clean(m.group(1)), "rows": []}
                  continue
              if current and line.startswith("|") and not line.startswith("//"):
                  cells = [clean(x) for x in line.strip("|").split("|")]
                  if any(cells):
                      current["rows"].append(cells)
          if current:
              facilities.append(current)

          print("=== FACILITY ROWS JSON ===")
          print(json.dumps(facilities, ensure_ascii=False, indent=2))

          region = fetch_source("地域建設システム")
          # Each base subsection contains a development table with repeated item/price pairs.
          bases = []
          current_name = None
          current_area = None
          for line in region.splitlines():
              m = re.match(r"\*\*\*([^\[]+)", line)
              if m:
                  current_name = clean(m.group(1)).strip()
                  current_area = None
                  continue
              if current_name and " - " in line and not line.startswith("|"):
                  val = clean(line).strip()
                  if 1 < len(val) < 100:
                      current_area = val
              if current_name and line.startswith("|") and "取引商品" not in line and "発展段階" not in line:
                  cells = [clean(x) for x in line.strip("|").split("|")]
                  if len(cells) < 6:
                      continue
                  stage = cells[0]
                  pairs = []
                  for i in range(4, len(cells)-1, 2):
                      item = cells[i].strip()
                      price = cells[i+1].strip() if i+1 < len(cells) else ""
                      if item and item not in {"-", ""} and re.fullmatch(r"[0-9,]+", price or ""):
                          pairs.append({"item": item, "price": int(price.replace(",",""))})
                  if pairs:
                      bases.append({
                          "base": current_name,
                          "area": current_area,
                          "stage": stage,
                          "items": pairs,
                      })

          print("=== REGION TRADE JSON ===")
          print(json.dumps(bases, ensure_ascii=False, indent=2))
